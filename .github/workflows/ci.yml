name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: 1. Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - run: ruff check backend/app backend/tests backend/scripts backend/migrations
      - run: ruff format --check backend/app backend/tests backend/scripts backend/migrations
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run audit:dependencies
        working-directory: frontend

  strict-types:
    name: 2. Strict types
    needs: format-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - run: mypy --strict app tests scripts
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  unit-tests:
    name: 3. Unit tests
    needs: strict-types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  local-integration-tests:
    name: 4. Local integration contracts
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - name: Run queue, Storage, provider, security and Excel contracts
        run: >-
          pytest -q
          tests/test_celery_runtime.py
          tests/test_supabase_storage.py
          tests/test_provider_adapters.py
          tests/test_provider_schema.py
          tests/test_export_xlsx.py
          tests/test_docx_parser.py
          tests/test_pdf_parser.py
          tests/security
        working-directory: backend

  migration-replay:
    name: 5. Empty PostgreSQL migration replay
    needs: local-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paper_grading_ci
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paper_grading_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - name: Prepare Supabase-owned schemas in the disposable database
        env:
          PGPASSWORD: postgres # pragma: allowlist secret
        run: |
          psql --host 127.0.0.1 --username postgres --dbname paper_grading_ci --set ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            invited_at timestamptz,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create function auth.uid() returns uuid
          language sql stable
          as $$ select nullif(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid $$;
          create schema storage;
          create table storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text not null,
            name text not null,
            metadata jsonb
          );
          SQL
      - name: Replay empty database to 0018, 0019, 0017, and 0019
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paper_grading_ci # pragma: allowlist secret
        run: |
          alembic upgrade 20260726_0018
          alembic current | grep -qx '20260726_0018'
          alembic upgrade 20260728_0019
          alembic current | grep -Eq '^20260728_0019( \(head\))?$'
          alembic downgrade 20260722_0017
          alembic current | grep -qx '20260722_0017'
          alembic upgrade 20260728_0019
          alembic current | grep -Eq '^20260728_0019( \(head\))?$'
        working-directory: backend
      - run: pytest -q tests/test_migrations.py
        working-directory: backend

  frontend-build:
    name: 6. Frontend production build
    needs: migration-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:sites
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.invalid.example
          VITE_SUPABASE_URL: https://project.invalid.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      - run: node --test scripts/sites-build.node-test.mjs
        working-directory: frontend
  browser-tests:
    name: 7. Desktop and mobile browser tests
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:local
        working-directory: frontend

  secret-scan:
    name: 8. Repository and build secret scan
    needs: browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check 'detect-secrets>=1.5,<2'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:sites
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.invalid.example
          VITE_SUPABASE_URL: https://project.invalid.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      - name: Scan tracked source without printing candidate values
        run: |
          set -o pipefail
          if ! git ls-files -co --exclude-standard -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline >/tmp/repository-secret-scan.log 2>&1; then
            echo "Secret scan failed. Review locally; candidate values are intentionally hidden."
            exit 1
          fi
      - name: Scan frontend build without printing candidate values
        run: |
          set -o pipefail
          if ! find frontend/dist -type f -print0 | xargs -0 detect-secrets-hook >/tmp/build-secret-scan.log 2>&1; then
            echo "Build secret scan failed. Review locally; candidate values are intentionally hidden."
            exit 1
          fi
