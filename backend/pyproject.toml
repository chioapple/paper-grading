[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-grading-backend"
version = "0.1.0"
description = "Paper Grading FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "certifi>=2025.1.31",
    "celery[redis]>=5.5,<6",
    "cryptography>=45,<46",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpcore>=1,<2",
    "msoffcrypto-tool>=5.4,<6",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf[crypto]>=6,<7",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "detect-secrets>=1.5,<2",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "reportlab>=4.2,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not postgres and not external'"
testpaths = ["tests"]
markers = [
    "postgres: requires an explicit independent PostgreSQL test database",
    "external: requires explicitly authorized independent external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "msoffcrypto",
    "msoffcrypto.*",
    "openpyxl",
    "openpyxl.*",
    "reportlab.*",
]
ignore_missing_imports = true
