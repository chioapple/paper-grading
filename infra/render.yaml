# Render Blueprint 规划文件。
# 资源规划文件，不代表已创建或可上线：
# - 所有自动部署均关闭；必须先补齐 sync:false 配置并完成阶段验收。
# - 免费 Web Service 不支持 pre-deploy command；数据库迁移必须在手动部署前显式执行。
# - Background Worker 与持久化 Key Value 均使用 Starter，创建前必须确认付费。
# - Redis 只承载 Celery 消息，所有任务状态与幂等事实都保存在 PostgreSQL。

previews:
  generation: 'off'

services:
  - type: web
    runtime: static
    name: paper-grading-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - frontend/**
        - infra/render.yaml
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

  - type: web
    runtime: python
    name: paper-grading-api
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - backend/**
        - infra/render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        # Render 使用带 ?ssl=require 的 Supavisor session pooler 5432，不使用仅 IPv6 的免费直连地址。
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paper-grading-queue
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: 5.0
      - key: READINESS_DATABASE_TIMEOUT_SECONDS
        value: 2.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: 5.0
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_SIGNED_URL_TTL_SECONDS
        value: 60
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: 60.0
      - key: PROVIDER_MASTER_KEY
        sync: false
      - key: AUTH_INVITE_REDIRECT_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: worker
    runtime: python
    name: paper-grading-worker
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.workers.supervisor
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - backend/**
        - infra/render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        # 必须使用 paper_grading_worker.<project-ref> 的 Supavisor session pooler 5432。
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paper-grading-queue
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: 5.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_SIGNED_URL_TTL_SECONDS
        value: 60
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: 60.0
      - key: PROVIDER_MASTER_KEY
        sync: false

  - type: worker
    runtime: python
    name: paper-grading-export-worker
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install .
    startCommand: celery -A app.export.celery_app:celery_app worker --loglevel=INFO --concurrency=1 --queues=paper_grading.exports --hostname=exports@%h
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - backend/**
        - infra/render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: EXPORT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paper-grading-queue
          property: connectionString
      - key: DATABASE_POOL_SIZE
        value: 2
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: 5.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_SIGNED_URL_TTL_SECONDS
        value: 60
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: 60.0

  - type: keyvalue
    name: paper-grading-queue
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
