# Render Blueprint 规划文件。
# 阶段 1 只固定资源边界，不代表已创建或可上线：
# - 所有自动部署均关闭；必须先补齐 sync:false 配置并完成阶段验收。
# - 免费 Web Service 不支持 pre-deploy command；数据库迁移必须在手动部署前显式执行。
# - Worker 与 Redis 要到阶段 10 才有真实入口，本文件暂不声明，避免提前创建无效资源。
# - Background Worker 没有免费实例，阶段 10 启用前还需要确认付费实例。

previews:
  generation: 'off'

services:
  - type: web
    runtime: static
    name: paper-grading-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - frontend/**
        - infra/render.yaml
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: python
    name: paper-grading-api
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: 'off'
    buildFilter:
      paths:
        - backend/**
        - infra/render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        # Render 使用带 ?ssl=require 的 Supavisor session pooler 5432，不使用仅 IPv6 的免费直连地址。
        sync: false
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: 5.0
      - key: READINESS_DATABASE_TIMEOUT_SECONDS
        value: 2.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_AUTH_TIMEOUT_SECONDS
        value: 5.0
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_SIGNED_URL_TTL_SECONDS
        value: 60
      - key: SUPABASE_STORAGE_TIMEOUT_SECONDS
        value: 60.0
      - key: PROVIDER_MASTER_KEY
        sync: false
      - key: AUTH_INVITE_REDIRECT_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
